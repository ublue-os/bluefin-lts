name: PR Validation — testsuite

on:
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Install just
        uses: taiki-e/install-action@262ea96a68a4effc27379c07c676063a76c6e740 # just

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Check justfile syntax
        run: just check

      - name: Shellcheck
        run: just lint

      - name: LTS build wait helper tests
        run: ./scripts/test-lts-build-wait.sh
