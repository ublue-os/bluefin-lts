name: Build Bluefin GNOME 50 (testing)

# Builds bluefin and bluefin-dx lts-testing-50 / lts-hwe-testing-50 using
# the same full build pipeline, selecting GNOME 50 packages via the
# gnome-version input. Only runs on main branch pushes.
#
# GNOME 50 is now the default for every LTS build, so these -50 tags
# duplicate the main builds. Kept for one release so existing -50 users keep
# getting updates; remove this workflow together with the GNOME 49 rollback path.
#
# pull_request and merge_group triggers are intentionally omitted. These
# builds duplicate main, and their check names collide with the required
# checks and merge queue, so this workflow runs post-merge (push) only.
#
# An earlier revision blamed EXDEV for PR-suite failures. It is an error
# dnf ignores, seen in green builds on both architectures. The explicit
# dracut in 26-packages-post.sh writes a valid initramfs. The 11-21 to
# 11-24 failures were a missing blur-my-shell zip.

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    with:
      image-name: bluefin
      tag-suffix: "50"
      gnome-version: "50"
      rechunk: ${{ github.event_name != 'pull_request' }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  build-hwe:
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    with:
      image-name: bluefin
      tag-suffix: "50"
      gnome-version: "50"
      hwe: true
      rechunk: ${{ github.event_name != 'pull_request' }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  build-dx:
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    with:
      image-name: bluefin-dx
      flavor: dx
      tag-suffix: "50"
      gnome-version: "50"
      rechunk: ${{ github.event_name != 'pull_request' }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  build-dx-hwe:
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    with:
      image-name: bluefin-dx
      flavor: dx
      tag-suffix: "50"
      gnome-version: "50"
      hwe: true
      rechunk: ${{ github.event_name != 'pull_request' }}
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
