name: Scheduled LTS Release

on:
  schedule:
    - cron: '0 6 * * 2'  # Weekly on Tuesday at 6 AM UTC (1 AM EST / 2 AM EDT)
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  actions: write
  packages: read

concurrency:
  group: scheduled-lts-release
  cancel-in-progress: false

jobs:
  trigger-lts-builds:
    runs-on: ubuntu-latest
    # Allow up to 3 hours for builds to complete before timing out.
    timeout-minutes: 180
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Trigger all LTS builds on lts branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          JOB_TIMEOUT_MINUTES=180
          POLL_MARGIN_MINUTES=30
          echo "BUILD_DEADLINE=$(( $(date +%s) + (JOB_TIMEOUT_MINUTES - POLL_MARGIN_MINUTES) * 60 ))" >> "$GITHUB_ENV"

          # Record time just before dispatch so we can find the run IDs afterward.
          echo "DISPATCH_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

          gh workflow run build-regular.yml --ref lts -R "$REPO"
          gh workflow run build-dx.yml --ref lts -R "$REPO"
          gh workflow run build-gdx.yml --ref lts -R "$REPO"
          gh workflow run build-regular-hwe.yml --ref lts -R "$REPO"
          gh workflow run build-dx-hwe.yml --ref lts -R "$REPO"

          echo "✅ Triggered all 5 LTS build workflows on lts branch"

      # gh run watch exits 1 both on an API blip and on a failed build, so the
      # shell cannot tell them apart. The helper polls run status instead: a
      # transient API error is retried, a bad conclusion fails the job.
      - name: Wait for regular LTS build to complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Wait for the API to register the newly dispatched run (usually < 30s).
          sleep 60

          RUN_ID=$(./scripts/lts-build-wait.sh find-run build-regular.yml)
          echo "Polling build-regular.yml run $RUN_ID. This takes ~60 minutes..."
          ./scripts/lts-build-wait.sh wait "$RUN_ID" "$REPO"
          echo "✅ Regular LTS build completed successfully"

      - name: Wait for DX LTS build to complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # generate-release.yml inspects bluefin-dx:lts.YYYYMMDD in addition to bluefin:lts.YYYYMMDD.
          # build-dx.yml runs in parallel with build-regular.yml and can finish slightly later.
          # We must wait for it to complete before triggering release generation, otherwise
          # generate-release.yml will fail with "manifest unknown" on the bluefin-dx tag.
          RUN_ID=$(./scripts/lts-build-wait.sh find-run build-dx.yml)
          echo "Polling build-dx.yml run $RUN_ID..."
          ./scripts/lts-build-wait.sh wait "$RUN_ID" "$REPO"
          echo "✅ DX LTS build completed successfully"

  generate-release:
    name: Generate release
    needs: trigger-lts-builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger release generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run generate-release.yml --ref main -f target=lts \
            -R ${{ github.repository }}
          echo "✅ Triggered release generation"
          echo "View workflow runs at: ${{ github.server_url }}/${{ github.repository }}/actions"
